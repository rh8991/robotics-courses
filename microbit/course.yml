# ============================================================
#  הגדרות הקורס – שם, צבע, טקסטים קבועים
# ============================================================
#  כל השדות כאן לא חובה. שדה שחסר – פשוט לא מוצג (או מקבל ברירת מחדל).
#  שדות:
#    title           – שם הקורס (בכותרת של כל דף ובלשונית הדפדפן)
#    theme           – ערכת הצבעים: microbit (סגול) / fll (ירוק) / lego (כתום)
#    welcome_title   – הכותרת הגדולה בדף הבית של הקורס
#    welcome         – משפט הפתיחה בדף הבית של הקורס
#    footer          – טקסט בתחתית כל דף. קישור כותבים כך: [טקסט](כתובת)
#    guide_password  – סיסמה לכניסה לדפי המדריך. בלי השדה הזה – אין סיסמה.
#                      שימו לב: הסיסמה גלויה לכל מי שפותח את הקובץ הזה, והיא רק
#                      מונעת מתלמידים להיכנס בטעות. לא לשים בדפי המדריך מידע רגיש.
#    platform        – סביבת התכנות: makecode / none
#                      (קובע אם יוצגו כפתורי "פתיחה ב-MakeCode" ו"הורדת קובץ HEX")
#    search_examples – מילים לדוגמה בתיבת החיפוש
#    sources         – מקורות השיעורים (השדה source בקובץ lessons.yml):
#                        id    – המזהה שכותבים ב-lessons.yml
#                        label – השם שמוצג על התגית ובסינון במאגר
#                        color – 1 או 2 = צבע של חלק א׳ / חלק ב׳; בלי color = צבע הקורס
#    flags           – תגיות מיוחדות: שם שדה ב-lessons.yml ← הטקסט שמוצג כשהשדה הוא true
#  החלקים של הקורס (parts ב-schedule.yml) צבועים לפי הסדר: הראשון בצבע 1, השני בצבע 2.
# ============================================================

title: "מעבדת מיקרוביט"
theme: microbit
welcome_title: "ברוכים הבאים למעבדת המיקרוביט! 👋"
welcome: "28 מפגשים של תכנות, אורות, צלילים ורובוטים. מי אתם?"
footer: "השיעורים מבוססים על [micro:bit Educational Foundation](https://microbit.org/projects/make-it-code-it/) ועל [Yahboom Tiny:bit](https://github.com/YahboomTechnology/Tiny-bit)"
guide_password: "בלה123"
platform: makecode
search_examples: [לב, חיישן אור, רדיו, מוזיקה]

sources:
  - id: microbit
    label: "micro:bit"
    color: 1
  - id: tinybit
    label: "Tiny:bit"
    color: 2
  - id: project
    label: "פרויקט"

flags:
  needs_v2: "דורש micro:bit V2"
