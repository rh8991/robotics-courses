# ============================================================
#  הגדרות הקורס – קישורים שמופיעים בדפי המדריך
# ============================================================
#  guide_materials – כפתור "מערכי השיעור" בדף המדריך ובכל שיעור (גרסת מדריך).
#                    title = הטקסט על הכפתור, url = הקישור (למשל תיקייה ב-Google Drive).
#                    לשיעור מסוים אפשר לתת קישור משלו: ב-lessons.yml, בתוך links, שדה plan.
#  tinybit         – קופסת "התוסף של Tiny:bit" שמופיעה למדריך בכל שיעור Tiny:bit.
#      extension   – כתובת התוסף (מדביקים אותה ב-MakeCode ← הרחבות)
#      starter     – קישור לפרויקט MakeCode התחלתי שכבר כולל את התוסף (לא חובה).
#                    מכינים פעם אחת: פרויקט חדש ← הוספת התוסף ← שיתוף ← מעתיקים את הקישור לכאן.
#      note        – ההסבר שמופיע בקופסה
#  אם משאירים שדה ריק ("") – הכפתור שלו לא מוצג.
# ============================================================

guide_materials:
  title: "מערכי השיעור המלאים"
  url: "https://drive.google.com/drive/folders/1XcUNBQOgLQW-GO7dURrUNFZWguDXngfx?usp=drive_link"

tinybit:
  extension: "https://github.com/YahboomTechnology/Tiny-bitLib"
  starter: ""
  note: "כדי שהרובוט יעבוד, צריך להוסיף ל-MakeCode את התוסף של Tiny:bit. מומלץ להוסיף אותו מראש בכל המחשבים (או לשתף פרויקט התחלתי שכבר כולל אותו) – כך התלמידים לא מתעכבים על זה בתחילת השיעור. ב-MakeCode: הרחבות ← מדביקים את הכתובת ← בוחרים Tinybit."
