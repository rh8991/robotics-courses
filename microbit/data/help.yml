# ============================================================
#  עמוד "פתרון תקלות" (help.html)
# ============================================================
#  groups – קבוצות של תקלות. לכל קבוצה:
#     title – שם הקבוצה      emoji – אייקון (לא חובה)
#     items – רשימת תקלות. לכל תקלה:
#        q     – מה קורה (כמו שתלמיד היה מתאר את זה)
#        steps – מה עושים, לפי הסדר (רשימה)
#        guide – הערה למדריך בלבד (לא חובה; לא מוצגת לתלמידים)
#  עיצוב בתוך טקסט:  **מודגש**   ו-  [[שם בלוק]]
#  לתקלה של שיעור מסוים: ב-lessons.yml, בתוך student, שדה troubleshooting (רשימה).
# ============================================================

groups:
  - title: "מעבירים את התוכנית ללוח"
    emoji: "🔌"
    items:
      - q: "המחשב לא מזהה את הלוח / לא מופיע כונן MICROBIT"
        steps:
          - "בודקים שהנורה הצהובה בגב הלוח דולקת כשהוא מחובר."
          - "מחליפים כבל – יש כבלי USB שמיועדים **לטעינה בלבד** ולא מעבירים מידע."
          - "מנסים שקע USB אחר במחשב (עדיף ישירות במחשב, לא במפצל)."
          - "מנתקים, מחכים 5 שניות ומחברים שוב."
        guide: "כדאי לסמן מראש בסרט צבעוני את הכבלים שנבדקו ועובדים."
      - q: "לחצתי 'הורדה' אבל על הלוח לא השתנה כלום"
        steps:
          - "בודקים איפה נשמר הקובץ: לרוב הוא בתיקיית **הורדות** ולא על הלוח."
          - "גוררים את קובץ ה-HEX מתיקיית ההורדות אל הכונן MICROBIT. הנורה הצהובה מהבהבת – והתוכנית עוברת."
          - "ב-Chrome או Edge אפשר לחבר את הלוח ישירות: ב-MakeCode לוחצים על שלוש הנקודות ליד 'הורדה' ← **חיבור מכשיר** – ומאז ההורדה עוברת ישר ללוח."
      - q: "על הלוח מופיע פרצוף עצוב ומספר"
        steps:
          - "זו הודעת שגיאה של התוכנית. לוחצים על כפתור האיפוס בגב הלוח."
          - "בודקים בסימולטור שהתוכנית עובדת, ומעבירים שוב."
          - "אם זה חוזר – מראים למדריך את המספר שמופיע."
        guide: "מספר 020 = אין מספיק זיכרון (למשל לולאה שיוצרת יותר מדי דברים). אם זה קורה בהרבה לוחות – כדאי לעדכן קושחה לפי ההוראות באתר microbit.org."

  - title: "MakeCode"
    emoji: "🧩"
    items:
      - q: "MakeCode נפתח באנגלית"
        steps:
          - "הכפתורים באתר שלנו פותחים את MakeCode בעברית. אם נכנסתם בדרך אחרת:"
          - "לוחצים על גלגל השיניים ⚙️ ← Language ← עברית."
      - q: "אני לא מוצא בלוק שכתוב בשיעור"
        steps:
          - "משתמשים בחיפוש בראש רשימת הקטגוריות וכותבים חלק משם הבלוק."
          - "חלק מהבלוקים נמצאים בתוך **עוד...** מתחת לקטגוריה."
          - "בשיעורי הרובוט: אם אין קטגוריה בשם **Tinybit** – צריך להוסיף את התוסף (ראו למטה)."
      - q: "בסימולטור זה עובד, אבל על הלוח לא"
        steps:
          - "בודקים שהעברתם את הגרסה האחרונה (מורידים שוב)."
          - "צלילים, מיקרופון וחיישן הלוגו עובדים רק ב-**micro:bit V2**. על גב הלוח כתוב איזו גרסה הוא."
          - "בתוכנית עם רדיו – צריך שני לוחות אמיתיים, עם אותו מספר קבוצה."

  - title: "חיישנים, צלילים ורדיו"
    emoji: "📡"
    items:
      - q: "אין צליל"
        steps:
          - "ב-micro:bit V2 יש רמקול מובנה. בודקים שהלוח הוא V2."
          - "ב-micro:bit V1 אין רמקול: מחברים אוזניות או זמזם עם תפסנים – אחד לפין 0 ואחד ל-GND."
      - q: "חיישן האור נותן מספרים מוזרים"
        steps:
          - "חיישן האור הוא **מסך הנורות** עצמו – מכסים אותו ביד ובודקים שהמספר יורד."
          - "מנורה חזקה מעל הלוח משפיעה. מנסים להזיז את הלוח."
      - q: "המצפן מבקש לסובב את הלוח"
        steps:
          - "זה כיול. מטים את הלוח לכל הכיוונים עד שכל הנורות דולקות – ואז המצפן מוכן."
      - q: "הטמפרטורה גבוהה ממה שבחדר"
        steps:
          - "החיישן מודד את חום המעבד שעל הלוח, ולכן הוא קצת חם יותר. משווים למדחום ומחסירים את ההפרש."
      - q: "הרדיו לא עובד – הלוח השני לא מקבל"
        steps:
          - "בשני הלוחות חייב להיות **אותו מספר קבוצה** ב-[[רדיו הגדר מזהה קבוצה]]."
          - "בודקים ששני הלוחות דולקים ושהתוכנית הועברה לשניהם."
          - "בכיתה עם הרבה זוגות – לכל זוג מספר קבוצה אחר."

  - title: "הרובוט Tiny:bit"
    emoji: "🤖"
    items:
      - q: "הרובוט לא זז בכלל"
        steps:
          - "בודקים שמתג ההפעלה של הרובוט דלוק ושהסוללה טעונה."
          - "בודקים שהמיקרוביט נכנס עד הסוף לחריץ, **המסך פונה קדימה**."
          - "בודקים שהתוכנית משתמשת בבלוקים של Tinybit ושהמהירות לא קטנה מדי."
        guide: "רובוט עם סוללה חלשה מתנהג \"מוזר\" (נוסע לאט, נעצר, חיישנים משתגעים) – זה הדבר הראשון לבדוק."
      - q: "אין קטגוריה בשם Tinybit ב-MakeCode"
        steps:
          - "צריך להוסיף את התוסף: **הרחבות** ← מדביקים את הכתובת ← בוחרים Tinybit."
          - "את הכתובת המדריך יכול להעתיק מהקופסה הכתומה בדף השיעור (גרסת המדריך)."
      - q: "הרובוט לא נוסע ישר"
        steps:
          - "בודקים שאין שערות או חוטים שנתפסו בגלגלים."
          - "שני מנועים אף פעם לא זהים לגמרי: נותנים לגלגל אחד מהירות קצת גבוהה יותר, עד שהרובוט נוסע ישר."
          - "מתעדים את המספרים שעבדו – לכל רובוט יש מספרים משלו."
      - q: "חיישני הקו לא מזהים את הקו"
        steps:
          - "הקו צריך להיות שחור ועבה (2–3 ס״מ) על רקע בהיר."
          - "בודקים את הערכים של החיישן על המסך מעל הקו ומחוץ לו."
          - "אור שמש חזק משפיע – מנסים להסיט וילון."
      - q: "חיישן המרחק נותן מספרים לא הגיוניים"
        steps:
          - "החיישן מודד טוב בין כמה סנטימטרים לבערך מטר. קרוב מדי או רחוק מדי – המספר משתגע."
          - "משטחים רכים (בד, ספוג) ומשטחים באלכסון בולעים את הגל. בודקים מול קיר ישר."

  - title: "בכיתה"
    emoji: "🏫"
    items:
      - q: "חלק מהקבוצות סיימו מהר והשאר תקועים"
        steps:
          - "לקבוצות שסיימו יש **אתגר** בסוף כל שיעור."
          - "קבוצה שסיימה יכולה לעזור לקבוצה אחרת – בלי לגעת במקלדת שלה, רק בהסבר."
        guide: "בגרסת המדריך של כל שיעור יש גם 'הרחבה לתלמידים מהירים'."
