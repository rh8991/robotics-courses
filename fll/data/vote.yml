# ============================================================
#  עמוד ההצבעות – שם, לוגו, בעיה ומיקוד לחקר, משימות במשחק
#  (הקובץ הזה בונה את העמוד vote.html)
# ============================================================
#  איך זה עובד בכיתה: הילדים מציעים, המדריך מקליד את ההצעות,
#  הילדים מצביעים בהרמת ידיים והמדריך מקליק את מספר הקולות.
#  כל מה שכתוב כאן הוא רק "רעיונות להשראה" – הילדים תמיד יכולים להציע משהו אחר.
#
#  topics – הנושאים להצבעה, לפי הסדר. לכל נושא:
#     id        – מזהה באנגלית (לא לשנות אחרי שהתחלתם להצביע!)
#     title     – שם הנושא          emoji – אייקון (לא חובה)
#     question  – השאלה שמוצגת בגדול על המקרן
#     keep      – (לא חובה) כמה זוכים שומרים. 1 = זוכה אחד (ברירת מחדל). 3 = שלוש הראשונות.
#     task      – (לא חובה) מזהה משימה בלוח הבקרה (data/season.yml) שאפשר לסמן ✓ בסוף ההצבעה
#     after     – (לא חובה) מזהה נושא שכדאי להחליט עליו קודם. התוצאה שלו מוצגת בכותרת.
#     ideas     – (לא חובה) רעיונות להשראה. לחיצה על רעיון מוסיפה אותו כהצעה.
#     prompts   – (לא חובה) שאלות מנחות שמוצגות בזמן ההצעות (לא נכנסות להצבעה).
#     note      – (לא חובה) הערה קטנה למדריך.
#
#  logo – הלוגו נבחר בשלוש הצבעות קטנות (parts). לכל אפשרות:
#     name – שם בעברית   en – אותו דבר באנגלית (נכנס לבקשה ל-AI)
#     hex  – צבע (רק בצבעים), למשל "#0f8a5f"     emoji – סמל לתצוגה המקדימה (לא חובה)
#  logo.prompt_en / prompt_he – הבקשה שנוצרת ל-AI. המילים {symbol} {colors} {style} מוחלפות בבחירות.
#
#  שימו לב לרווחים בתחילת השורה – הם חשובים!
# ============================================================

topics:
  - id: name
    title: "שם הקבוצה"
    emoji: "🏷️"
    question: "איך תיקרא הקבוצה שלנו?"
    keep: 1
    task: team-name
    prompts:
      - "שם שקשור לעונה – אור, טבע, יצורים חיים"
      - "שם שקשור לרובוטים ולטכנולוגיה"
      - "שם קצר שקל לצעוק ביחד בתחרות 📣"
    ideas:
      - "הגחליליות"
      - "ביו-בוטס"
      - "זוהרים"
      - "הפרפרים הרובוטיים"
      - "המאביקים"
      - "נצנוץ"

  - id: logo
    title: "לוגו"
    emoji: "🎨"
    question: "איך ייראה הלוגו שלנו?"

  - id: problem
    title: "בעיה לחקר"
    emoji: "🔎"
    question: "איזו בעיה אמיתית מעולם המגוון הביולוגי נחקור?"
    keep: 1
    task: res-choose
    note: "כדאי שכל ילד יציג קודם את הבעיה שהביא מהבית (משימה res-bring בלוח הבקרה)."
    prompts:
      - "איזה יצור חי או צמח בסביבה שלנו בסכנה?"
      - "מה בני אדם עושים שפוגע בטבע – ואפשר לשנות?"
      - "מה ראיתם בטיול, בחוף או בשכונה שהטריד אתכם?"
    ideas:
      - "זיהום אור פוגע בגחליליות ובחרקים של הלילה"
      - "מעט מאביקים (דבורים, פרפרים) בגינות בעיר"
      - "כרישים בחוף חדרה – איך שומרים עליהם ועל המתרחצים"
      - "מינים פולשים שדוחקים צמחים ובעלי חיים מקומיים"
      - "ירידה במספר הפרפרים בישראל"
      - "פלסטיק בים שפוגע בבעלי חיים ימיים"
      - "בעלי חיים שנפגעים על כבישים"

  - id: focus
    title: "מיקוד החקר"
    emoji: "🎯"
    question: "על איזה חלק של הבעיה נתמקד?"
    keep: 1
    after: problem
    note: "בעיה גדולה מדי קשה לפתור. בוחרים חלק אחד שאפשר לחקור באמת – ושאפשר לדבר עליו עם מומחה."
    prompts:
      - "מי נפגע מהבעיה? (בעל חיים, צמח, אנשים)"
      - "איפה זה קורה אצלנו – בשכונה, בעיר, בחוף?"
      - "מה גורם לבעיה?"
      - "מי כבר מנסה לפתור אותה? (עמותה, חוקרים, רשות הטבע והגנים)"
      - "מה אנחנו יכולים לבדוק או למדוד בעצמנו?"

  - id: missions
    title: "משימות במשחק הרובוט"
    emoji: "🤖"
    question: "באילו משימות על המגרש נתחיל?"
    keep: 3
    task: str-runs
    note: "את שמות המשימות מקלידים מתוך מדריך המשחק, או ממלאים אותם פעם אחת ב-robot_missions למטה."
    prompts:
      - "כמה נקודות המשימה שווה?"
      - "כמה זמן היא תיקח לרובוט?"
      - "האם היא קרובה לאזור השיגור?"
      - "האם היא נראית לנו קלה או קשה?"

# שמות המשימות של משחק הרובוט בעונה – למלא מתוך מדריך המשחק (Robot Game).
# כל שורה: "M01 – שם המשימה". הן יופיעו כרעיונות בנושא "משימות במשחק הרובוט".
robot_missions: []

logo:
  parts:
    - id: colors
      title: "צבעים"
      emoji: "🖍️"
      question: "באילו צבעים? (כל ילד יכול להצביע לשני צבעים)"
      keep: 2
      options:
        - { name: "טורקיז זוהר", en: "glowing teal", hex: "#14b8a6" }
        - { name: "סגול", en: "purple", hex: "#7c3aed" }
        - { name: "ירוק עלה", en: "leaf green", hex: "#16a34a" }
        - { name: "צהוב זוהר", en: "neon yellow", hex: "#facc15" }
        - { name: "כחול לילה", en: "midnight blue", hex: "#1e3a8a" }
        - { name: "כתום", en: "orange", hex: "#f97316" }
        - { name: "ורוד", en: "pink", hex: "#ec4899" }
    - id: symbol
      title: "סמל"
      emoji: "🦋"
      question: "מה יהיה במרכז הלוגו?"
      keep: 1
      options:
        - { name: "פרפר זוהר", en: "a glowing butterfly", emoji: "🦋" }
        - { name: "גחלילית", en: "a firefly with a glowing tail", emoji: "✨" }
        - { name: "כריש", en: "a friendly shark", emoji: "🦈" }
        - { name: "עלה עם מעגלים חשמליים", en: "a leaf with circuit lines", emoji: "🌿" }
        - { name: "רובוט חמוד", en: "a cute robot", emoji: "🤖" }
        - { name: "דבורה", en: "a bee", emoji: "🐝" }
        - { name: "מדוזה זוהרת", en: "a glowing jellyfish", emoji: "🪼" }
    - id: style
      title: "סגנון"
      emoji: "✏️"
      question: "באיזה סגנון?"
      keep: 1
      options:
        - { name: "מצויר וחמוד", en: "cute cartoon" }
        - { name: "קומיקס", en: "comic book" }
        - { name: "פיקסלים (משחק מחשב)", en: "pixel art" }
        - { name: "פשוט ונקי", en: "minimal flat" }
        - { name: "סמל של קבוצת ספורט", en: "sports team badge" }
  prompt_en: "Logo for a children's robotics team. Main symbol: {symbol}. Colors: {colors}. Style: {style}. Simple bold shapes, centered, white background, no text, no letters."
  prompt_he: "לוגו לקבוצת רובוטיקה של ילדים. במרכז: {symbol}. צבעים: {colors}. סגנון: {style}. צורות פשוטות ובולטות, באמצע, רקע לבן, בלי טקסט ובלי אותיות."
