judging:
  - id: core-values
    title: "ערכי ליבה"
    emoji: "🤝"
    summary: "איך הקבוצה עובדת יחד – נבדק לאורך כל היום, בחדר השיפוט וגם ליד המגרש."
    rubric: "https://www.firstinspires.org/resource-library/fll/challenge/challenge-and-resources"
    look_for:
      - "גילוי, חדשנות, השפעה, הכלה, עבודת צוות והנאה – עם דוגמאות אמיתיות"
      - "כל הילדים משתתפים ומדברים, לא רק אחד"
      - "מקצועיות אדיבה: כבוד ועזרה גם לקבוצות אחרות"
  - id: project
    title: "פרויקט חדשנות"
    emoji: "🔬"
    summary: "בעיה אמיתית → מחקר → פתרון → שיתוף → הצגה."
    rubric: "https://www.firstinspires.org/resource-library/fll/challenge/challenge-and-resources"
    look_for:
      - "זיהוי: הבעיה מוגדרת בבירור, והמחקר מגוון (כולל מומחה)"
      - "תכנון: איך נבחר הפתרון ואיך חילקו את העבודה"
      - "יצירה: אב-טיפוס / מודל שמסביר את הפתרון"
      - "שיפור: שיתפו, קיבלו משוב ושיפרו"
      - "הצגה: ברורה, יצירתית, וכל הקבוצה משתתפת"
  - id: robot-design
    title: "תכנון הרובוט"
    emoji: "🛠️"
    summary: "איך תכננו, בנו, תכנתו ושיפרו את הרובוט – והאם יודעים להסביר."
    rubric: "https://www.firstinspires.org/resource-library/fll/challenge/challenge-and-resources"
    look_for:
      - "אסטרטגיה ברורה לבחירת משימות"
      - "רובוט ואביזרים שנבנו ונבדקו בשיטתיות"
      - "קוד מסודר ומובן, שימוש בחיישנים"
      - "תיעוד של ניסויים ושיפורים לאורך הזמן"
  - id: robot-game
    title: "משחק הרובוט"
    emoji: "🤖"
    summary: "ריצות של 2:30 דקות על המגרש; נספר הניקוד הטוב ביותר."
    look_for:
      - "ריצות עקביות – אותו ניקוד בכל ניסיון"
      - "החלפת אביזרים מהירה ומסודרת"
      - "בלי נגיעות ברובוט מחוץ לאזור המותר (= הורדת נקודות)"

