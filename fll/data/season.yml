# ============================================================
#  לוח הבקרה למדריך – כל המשימות עד התחרות
#  (הקובץ הזה בונה את העמוד control.html)
# ============================================================
#  איך עורכים:
#  - season    – שם העונה ותאריך התחרות (הספירה לאחור מחושבת ממנו).
#       meeting_day – (לא חובה) יום המפגש הרגיל: ראשון / שני / שלישי / רביעי / חמישי / שישי.
#                     זו רק ברירת מחדל – כל מדריך יכול לבחור יום אחר בעמוד עצמו (⚙️ הגדרות).
#                     בלי השדה הזה – שלישי.
#       no_meetings – (לא חובה) תאריכים שאין בהם מפגש (חגים, חופשות), למשל ["2026-12-08"].
#                     המפגש בתאריך כזה מדולג ולא נספר.
#  - areas     – תחומי העבודה. כל משימה משויכת לתחום אחד (area).
#  - phases    – שלבי העונה לפי הסדר. לכל שלב:
#       id     – מזהה באנגלית, בלי רווחים (לא לשנות אחרי שהתחלתם לסמן!)
#       title  – שם השלב       emoji – אייקון (לא חובה)
#       from / to – תאריכי השלב בפורמט 2026-10-20 (שנה-חודש-יום)
#       goal   – משפט אחד: מה צריך להיות מוכן בסוף השלב
#       tasks  – רשימת משימות. לכל משימה:
#           id    – מזהה קצר באנגלית, ייחודי (הסימון ✓ נשמר לפיו – לא לשנות!)
#           text  – מה עושים          who  – מדריך / קבוצה
#           due   – תאריך יעד (לא חובה)   area – מזהה תחום מתוך areas
#           link  – קישור (לא חובה): { title: "...", url: "..." }
#           links – כמה קישורים (לא חובה), רשימה של { title: "...", url: "..." }
#           verify: true – מציג תגית "לבדוק" (מידע שעוד לא אומת מול FIRST ישראל)
#  - judging   – ארבעת תחומי השיפוט: מה השופטים בודקים (look_for) + rubric – קישור למחוון.
#  - rating_levels – ארבע הדרגות לדירוג העצמי (מהנמוכה לגבוהה).
#  - links     – קישורים וקבצים, מחולקים לקבוצות.
#
#  איך העמוד בוחר "מה עושים במפגש הזה":
#    🎯 משימה עם due – מופיעה במפגש שלפני תאריך היעד (מיום המפגש ועד לפני המפגש הבא).
#    🔁 משימה בלי due – מופיעה בכל מפגש שבו השלב שלה פעיל (בין from ל-to).
#    ⏰ משימה שתאריך היעד שלה עבר ולא סומנה – מופיעה במפגש של היום.
#  עיצוב בתוך טקסט:  **מודגש**
#  שימו לב לרווחים בתחילת השורה – הם חשובים!
# ============================================================

season:
