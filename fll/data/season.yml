  meeting_day: שלישי
  no_meetings: []
  intro: "כל מה שצריך לעשות מעכשיו ועד התחרות, לפי שלבים. מסמנים ✓ כשמשימה בוצעה – הסימונים נשמרים בדפדפן הזה."

